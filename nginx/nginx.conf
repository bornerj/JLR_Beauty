# PLAN-0042 / Onda 2 — limite de requisições nas rotas de autenticação (por IP real).
# 30 req/min por IP + rajada de 20: folgado para uso humano e o keep-alive da sessão,
# apertado para força bruta/credential stuffing (o limite fino por conta/e-mail fica na API).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Docker internal DNS — re-resolve hostnames when containers are recreated
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    client_max_body_size 20M;

    # PLAN-0042 / Onda 7a — não anunciar a versão do nginx.
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~ ^/health(/.*)?$ {
        set $upstream_api api:3001;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rotas de autenticação: mesmo proxy de /api/, com limite de taxa.
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        set $upstream_api api:3001;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCREVE (não concatena): o cliente não escolhe o próprio IP. A API usa req.ip.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $upstream_api api:3001;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCREVE (não concatena): o cliente não escolhe o próprio IP. A API usa req.ip.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        set $upstream_api api:3001;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $upstream_web web:80;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors off;
    }
}
